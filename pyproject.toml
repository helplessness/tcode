[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tcode-agent"
version = "0.0.2"
description = "A local-first agent runtime with plugins, MCP, memory, research, and isolated execution."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TCode contributors" }]
keywords = ["agent", "mcp", "plugins", "research", "sandbox"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "aiohttp>=3.9.0",
  "markdownify>=0.12.0",
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "pydantic>=2.0.0",
  "python-multipart>=0.0.18",
  "openai>=1.0.0",
  "anthropic>=0.40.0",
  "httpx>=0.27.0",
  "PyYAML>=6.0.0",
  "jsonschema>=4.23.0",
  "rdflib>=7.0.0",
  "pypdf>=5.0.0",
  "packaging>=24.0",
  "cryptography>=42.0.0",
]

[project.optional-dependencies]
desktop = [
  "fastmcp==3.2.4",
  "typer==0.21.2",
]
full = [
  "swarms>=6.8.1",
  "numpy>=1.26.0",
  "faiss-cpu>=1.8.0",
  "redis>=5.0.0",
]
dev = [
  "build>=1.2.2",
  "openpyxl>=3.1.0",
  "pandas>=2.2.0",
  "pytest>=8.3.0",
]
release = [
  "build>=1.2.2",
  "twine>=5.1.1",
]

[project.scripts]
tcode = "tcode_agent.cli:main"
tcode-server = "tcode_agent.server.launcher:main"
tcode-plugin = "tcode_agent.plugin_sdk.cli:main"

[project.urls]
Documentation = "https://github.com/helplessness/benchthread#readme"
Issues = "https://github.com/helplessness/benchthread/issues"
Source = "https://github.com/helplessness/benchthread"

[tool.setuptools.packages.find]
include = ["tcode_agent*"]

[tool.setuptools]
include-package-data = true

# 系统提示词必须随 wheel 分发，不能依赖源码工作目录。
[tool.setuptools.package-data]
"tcode_agent.prompt" = ["templates/*.md"]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
