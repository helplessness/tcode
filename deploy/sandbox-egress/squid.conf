http_port 3128
visible_hostname tcode-egress-proxy
access_log none
cache_log /dev/null
cache deny all

acl CONNECT method CONNECT
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443

acl loopback dst 127.0.0.0/8 ::1/128
acl link_local dst 169.254.0.0/16 fe80::/10
acl private_net dst 10.0.0.0/8
acl private_net dst 100.64.0.0/10
acl private_net dst 172.16.0.0/12
acl private_net dst 192.168.0.0/16
acl private_net dst fc00::/7
acl metadata_ip dst 169.254.169.254/32
acl metadata_host dstdomain .metadata.google.internal
acl denied_domains dstdomain "/etc/squid/denied_domains.txt"

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny loopback
http_access deny link_local
http_access deny private_net
http_access deny metadata_ip
http_access deny metadata_host
http_access deny denied_domains
http_access allow all
http_access deny all

forwarded_for delete
request_header_access X-Forwarded-For deny all
request_header_access Via deny all
