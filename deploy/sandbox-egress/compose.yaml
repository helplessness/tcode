services:
  egress-proxy:
    image: ubuntu/squid:latest
    container_name: tcode-egress-proxy
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run:size=16m,nosuid,nodev,noexec
      - /var/log/squid:size=64m,nosuid,nodev,noexec
      - /var/spool/squid:size=64m,nosuid,nodev,noexec
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
      - ./denied_domains.txt:/etc/squid/denied_domains.txt:ro
    networks:
      - outbound

networks:
  outbound:
    driver: bridge
