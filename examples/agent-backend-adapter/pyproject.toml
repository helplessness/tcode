[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tcode-sample-agent-backend"
version = "0.1.0"
description = "Minimal third-party AgentBackend for TCode"
requires-python = ">=3.12"
dependencies = ["tcode-agent>=0.0.1"]

[project.entry-points."tcode.agent_backends"]
sample-agent = "tcode_sample_backend:SampleAgentBackend"

[tool.setuptools]
py-modules = ["tcode_sample_backend"]
